name: Windows

on:
  push:
    branches:
      - master
      - ci/*
  pull_request:
    branches:
      - master

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
#  MELONDS_VERSION_SUFFIX: " RC"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            image: windows-2025-vs2026
          - name: arm64
            image: windows-11-arm

    name: ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.image }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
    - name: Check out sources
      uses: actions/checkout@v6
    - name: Restore vcpkg cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{ matrix.arch.name }}-windows-
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json
    - name: Build
      uses: lukka/run-cmake@v10
      with:
        configurePreset: release-windows-${{ matrix.arch.name }}
        configurePresetAdditionalArgs: "['-DENABLE_DEBUG_DEPS=OFF', '-DMELONDS_EMBED_BUILD_INFO=ON']"
        buildPreset: release-windows-${{ matrix.arch.name }}
    - name: Check executable startup
      shell: pwsh
      run: |
        $exe = Join-Path $env:GITHUB_WORKSPACE 'build/release-windows-${{ matrix.arch.name }}/melonDS.exe'
        if (!(Test-Path $exe)) { throw "Windows executable was not built: $exe" }
        $process = Start-Process -FilePath $exe -ArgumentList '--help' -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw "melonDS --help failed with exit code $($process.ExitCode)" }
    - uses: actions/upload-artifact@v7
      with:
        name: melonDS-windows-${{ matrix.arch.name }}
        path: .\build\release-windows-${{ matrix.arch.name }}\melonDS.exe
        if-no-files-found: error
    - name: Save vcpkg cache
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles('vcpkg.json') }}
